# BEGIN_KITTY_THEME
# Nordfox
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

background_blur 1
background_opacity 0.95

remember_window_size no

# Ctrl+Backspace -> ^W (zsh: backward-kill-word). Mode 'normal' so apps using the
# kitty keyboard protocol (e.g. nvim) still get the real ctrl+backspace key.
map ctrl+backspace send_text normal \x17
